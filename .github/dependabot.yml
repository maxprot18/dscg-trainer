# Mises à jour proposées chaque semaine : actions GitHub (épinglées par empreinte) et dépendances npm.
# Les versions majeures (React 19, TypeScript 7…) demandent une migration dédiée : pas de PR automatique,
# elles sont suivies dans les audits. Les mises à jour mineures et correctives npm sont groupées en une PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      mineures:
        update-types: ['minor', 'patch']
