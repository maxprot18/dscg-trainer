# CI + déploiement GitHub Pages de la PWA (Vite, base /dscg-trainer/).
# - PR vers main (et push sur main) : lint, validation du contenu, tests, build, tests de bout en bout.
#   Les branches ne lancent pas de run au push : leur PR le fait, ce qui évite deux runs par commit.
# - main (push ou lancement manuel) : publication sur GitHub Pages.
name: CI & déploiement Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions minimales par défaut ; le job deploy élargit les siennes.
permissions:
  contents: read

# Un seul run par ref. Les runs obsolètes sont annulés, sauf sur main
# (ne jamais interrompre un déploiement en cours).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historique complet : date de dernière révision de chaque fiche (build/courseDates.ts).
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npm run build

      # Parcours dans un vrai navigateur (Chromium mobile) sur le build de production.
      - name: Tests de bout en bout
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      # Fallback SPA (routes profondes) et désactivation de Jekyll.
      - name: Préparer dist pour GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Artefact Pages uniquement pour main (push ou lancement manuel).
      - name: Publier l'artefact Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Nécessaire pour embarquer .nojekyll (fichiers cachés exclus par défaut).
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tente d'activer Pages (source « GitHub Actions ») s'il ne l'est pas.
      # Avec le GITHUB_TOKEN l'activation peut être refusée : on n'échoue pas ici,
      # deploy-pages signalera l'erreur si Pages reste désactivé.
      - name: Configurer Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
        with:
          enablement: true

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
